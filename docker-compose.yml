name: open-meteo-react-app

services:
  # Nom du service interne pour Docker Compose
  weather-backend:
    build: ./backend
    # Nom exact du conteneur visible dans "docker ps"
    container_name: weather_backend_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  weather-frontend:
    build: ./frontend
    container_name: weather_frontend_ui
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - weather-backend
    restart: unless-stopped